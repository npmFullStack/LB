<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/src/assets/images/logo.svg"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LutongBahay | Filipino Recipes</title>
        
        <!-- Add base styles for error display -->
        <style>
            #error-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background: #ff4444;
                color: white;
                padding: 20px;
                z-index: 99999;
                font-family: monospace;
                font-size: 14px;
                border-bottom: 3px solid #cc0000;
                display: none;
                max-height: 50vh;
                overflow-y: auto;
            }
            #error-overlay pre {
                background: rgba(0,0,0,0.5);
                padding: 10px;
                border-radius: 5px;
                overflow-x: auto;
                color: #ffcccc;
            }
            .error-close {
                position: absolute;
                top: 10px;
                right: 20px;
                cursor: pointer;
                font-size: 24px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div id="error-overlay">
            <span class="error-close" onclick="this.parentElement.style.display='none'">×</span>
            <strong>⚠️ Runtime Error Detected</strong>
            <div id="error-message"></div>
        </div>
        
        <div id="root">
            <!-- Loading indicator -->
            <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif;">
                <div style="text-align: center;">
                    <div style="width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #f97316; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px;"></div>
                    <p style="color: #666;">Loading LutongBahay...</p>
                </div>
            </div>
            <style>
                @keyframes spin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
            </style>
        </div>
        
        <script type="module" src="/src/main.jsx"></script>

        <script>
            // Enhanced error handling
            (function() {
                const errorOverlay = document.getElementById('error-overlay');
                const errorMessageDiv = document.getElementById('error-message');
                
                function showError(message, error) {
                    if (errorOverlay) {
                        errorOverlay.style.display = 'block';
                        errorMessageDiv.innerHTML = `
                            <p><strong>${message}</strong></p>
                            ${error ? `<pre>${error.stack || error.toString()}</pre>` : ''}
                            <p><small>Check the console (F12) for more details.</small></p>
                        `;
                    }
                }
                
                // Global error handler
                window.addEventListener('error', function(event) {
                    console.error('❌ Global Error:', {
                        message: event.message,
                        filename: event.filename,
                        lineno: event.lineno,
                        colno: event.colno,
                        error: event.error
                    });
                    
                    showError('JavaScript Error', event.error || new Error(event.message));
                    return false;
                });
                
                // Unhandled promise rejection handler
                window.addEventListener('unhandledrejection', function(event) {
                    console.error('❌ Unhandled Promise Rejection:', event.reason);
                    showError('Unhandled Promise Rejection', event.reason);
                    event.preventDefault();
                });
                
                // Override console.error for additional visibility
                const originalConsoleError = console.error;
                console.error = function(...args) {
                    originalConsoleError.apply(console, args);
                    const errorMsg = args.map(arg => {
                        if (arg instanceof Error) return arg.message;
                        if (typeof arg === 'object') return JSON.stringify(arg);
                        return String(arg);
                    }).join(' ');
                    
                    if (errorMsg.includes('Failed to fetch') || errorMsg.includes('import') || errorMsg.includes('Cannot find module')) {
                        showError('Module Loading Error', new Error(errorMsg));
                    }
                };
                
                console.log('🚀 Global error handlers initialized');
                console.log('📦 Checking for required modules...');
                
                // Check if React is loaded (will be logged after main.jsx loads)
                setTimeout(() => {
                    if (typeof window.React === 'undefined') {
                        console.warn('⚠️ React not detected yet, waiting for main.jsx to load');
                    }
                }, 1000);
            })();
        </script>
        
        <!-- Show navigation console help -->
        <script>
            console.log('%c🔧 Debug Commands Available:', 'color: #f97316; font-size: 14px; font-weight: bold;');
            console.log('  - window.checkRoutes() - Check if routes are registered');
            console.log('  - window.getErrorLog() - Get error log');
            
            window.checkRoutes = function() {
                console.log('Checking application state...');
                const root = document.getElementById('root');
                console.log('Root element:', root);
                console.log('Root innerHTML length:', root?.innerHTML?.length);
                console.log('Current URL:', window.location.href);
            };
            
            window.getErrorLog = function() {
                return console.error.args || 'No error log available';
            };
        </script>
    </body>
</html>
