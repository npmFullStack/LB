<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link
            rel="icon"
            type="image/svg+xml"
            href="/src/assets/images/logo.svg"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LutongBahay</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>

        <script>
            // Global error handling to catch errors that might not appear in console
            window.addEventListener('error', function(event) {
                console.error('Global Error Caught:', {
                    message: event.message,
                    filename: event.filename,
                    lineno: event.lineno,
                    colno: event.colno,
                    error: event.error
                });
                return false;
            });

            // Catch unhandled promise rejections
            window.addEventListener('unhandledrejection', function(event) {
                console.error('Unhandled Promise Rejection:', {
                    reason: event.reason,
                    promise: event.promise
                });
                event.preventDefault();
            });

            // Override console.error to ensure errors are always visible
            const originalConsoleError = console.error;
            console.error = function(...args) {
                originalConsoleError.apply(console, args);
                // Additional logging for Vite development server
                if (import.meta.env.DEV) {
                    const errorDiv = document.createElement('div');
                    errorDiv.style.cssText = 'position:fixed;bottom:10px;right:10px;background:red;color:white;padding:10px;z-index:9999;font-size:12px;max-width:300px;word-wrap:break-word;';
                    errorDiv.textContent = args.join(' ').substring(0, 200);
                    setTimeout(() => errorDiv.remove(), 5000);
                    document.body.appendChild(errorDiv);
                }
            };

            // Log when Vite HMR connects
            if (import.meta.hot) {
                console.log('✅ Vite HMR is active');
            }

            console.log('🚀 App starting with global error handling enabled');
        </script>
    </body>
</html>
